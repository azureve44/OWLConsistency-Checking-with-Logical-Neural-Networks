# lubm_consistency.yaml
# ─────────────────────────────────────────────────────────────────────────────
# ModernBERT fine-tune: Ontology Consistency Verification on LUBM-100
#
# Task:   Binary classification — consistent (0) vs inconsistent (1)
# Input:  Serialised ABox fact strings (≤512 tokens)
# Labels: Derived from HermiT reasoning (ground truth oracle)
#
# Run with:
#   composer main.py yamls/lubm_consistency.yaml
#
# Prerequisites:
#   1. ModernBERT repo cloned and dependencies installed
#   2. dataset/ directory written by prepare_dataset.py
#   3. Pre-trained ModernBERT-base checkpoint available (HuggingFace or local)
# ─────────────────────────────────────────────────────────────────────────────

max_seq_len:     512
run_name:        lubm-consistency-modernbert-base
seed:            42

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  name: hf_bert_classification          # ModernBERT classification head
  pretrained_model_name_or_path: answerdotai/ModernBERT-base
  num_labels: 2                          # consistent=0, inconsistent=1
  use_pretrained_weights: true
  pretrained_checkpoint: null            # set to local .pt path if offline

# ── Tokeniser ─────────────────────────────────────────────────────────────────
tokenizer:
  name: answerdotai/ModernBERT-base
  kwargs:
    max_length:       512
    padding:          max_length
    truncation:       true
    return_tensors:   pt

# ── Training data ──────────────────────────────────────────────────────────────
train_loader:
  name: text
  dataset:
    streaming:     false                 # NoStreamingDataset — best for local SSD
    local:         dataset/train.jsonl
    split:         train
    shuffle:       true
    max_seq_len:   512
    text_field:    text                  # JSON key for the input string
    label_field:   label                 # JSON key for the integer label (0/1)
  drop_last: false
  num_workers: 8
  pin_memory: true
  dataloader_kwargs:
    batch_size: 32

# ── Validation data ────────────────────────────────────────────────────────────
eval_loader:
  name: text
  dataset:
    streaming:     false
    local:         dataset/val.jsonl
    split:         val
    shuffle:       false
    max_seq_len:   512
    text_field:    text
    label_field:   label
  drop_last: false
  num_workers: 4
  dataloader_kwargs:
    batch_size: 64

# ── Optimiser ─────────────────────────────────────────────────────────────────
optimizer:
  name: decoupled_adamw
  lr:           2.0e-5
  betas:        [0.9, 0.999]
  eps:          1.0e-8
  weight_decay: 0.01

# ── Learning rate schedule ─────────────────────────────────────────────────────
scheduler:
  name: linear_decay_with_warmup
  t_warmup: 0.06dur             # 6% of total steps as warmup
  alpha_f:  0.0

# ── Training duration ─────────────────────────────────────────────────────────
max_duration:        5ep        # 5 epochs — adjust based on dataset size
eval_interval:       1ep
eval_first:          false
save_interval:       1ep
save_num_checkpoints_to_keep: 2

# ── Callbacks and logging ──────────────────────────────────────────────────────
callbacks:
  - name: lr_monitor
  - name: speed_monitor
    window_size: 100
  - name: early_stopper
    monitor: metrics/eval/BinaryF1Score
    patience: 2
    comp: greater

loggers:
  - name: console
  - name: tensorboard
    log_dir: ./tensorboard_logs/lubm_consistency

# ── Evaluation metrics ─────────────────────────────────────────────────────────
# Reported against the val split each epoch; used for early stopping
# and for comparison against HermiT benchmark results.
eval_metrics:
  - BinaryAccuracy
  - BinaryF1Score
  - BinaryPrecision
  - BinaryRecall

# ── Precision ──────────────────────────────────────────────────────────────────
precision: amp_bf16           # bfloat16 mixed precision (Ampere+ GPUs)
                               # use amp_fp16 for older hardware

# ── Checkpointing ─────────────────────────────────────────────────────────────
save_folder:      checkpoints/lubm_consistency
autoresume:       false

# ── HermiT benchmark comparison ────────────────────────────────────────────────
# After training, run evaluate_vs_hermit.py --checkpoint <best_ckpt>
#                                           --test       dataset/test.jsonl
#                                           --benchmark  dataset/hermit_benchmark.jsonl
# That script reports agreement rate, F1 delta, and per-class breakdown.